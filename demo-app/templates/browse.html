<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ brand_name }} · recipes for everyday cooking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ browse_href }}" aria-label="{{ brand_name }} home">
      <span class="brand-mark" aria-hidden="true">TS</span>{{ brand_name }}
    </a>
  </header>
  <main>
    <section class="hero">
      <h1>{{ tagline }}</h1>
      <p>{{ hero_sentence }}</p>
    </section>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="recipe-search" type="search" name="q"
             placeholder="{{ search_placeholder }}"
             aria-label="{{ search_placeholder }}" autocomplete="off">
    </label>
    <div class="section-heading">
      <h2>All recipes</h2>
      <span id="count">{{ match_count }} recipe{{ '' if match_count == 1 else 's' }}</span>
    </div>
    <section class="recipe-grid" id="recipe-grid" aria-live="polite">
      {% for card in cards %}
        {% include "_partials/recipe_card.html" %}
      {% endfor %}
    </section>
    <p class="empty-state" id="empty-state" hidden>{{ empty_state }}</p>
  </main>
  <nav class="tabbar" aria-label="Primary">
    <a class="active" href="{{ browse_href }}">Browse</a>
  </nav>
</body>
</html>
