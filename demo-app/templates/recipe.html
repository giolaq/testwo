<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }} · {{ brand_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="recipe-page">
  {# Minimal recipe page: routing and the 404 path are provable from here. The
     metadata block, ingredient list, numbered steps and the state-bearing save
     control are rendered by T-DETAIL from the context detail_context already
     supplies. #}
  <main class="recipe-shell">
    <a class="back" href="{{ back_href }}">← Browse</a>
    <h1>{{ title }}</h1>
    <p class="recipe-description">{{ description }}</p>
  </main>
</body>
</html>
